<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
</head>
<body>
  <main class="main">
    <div class="container">
      <div class="about">
        <div class="big-line"></div>
        <h1 class="about"></h1>
        <a href="" class="main-link">Главная</a>
        <a href="" class="about-link"></a>
      </div>
      <div class="about">
        <img src="" alt="">
        <div class="expert">
          <div class="big-line"></div>
          <h2 class="title"></h2>
          <p class="text"></p>
        </div>
      </div>
      <div class="main-wrapper__advantage">
        <div class="swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="advantage">
                <img class="" src="/images/main/1.svg" alt="">
                <p class="advantage__text">
                  Непрерывная работа c 2017 года
                </p>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="advantage">
                <img class="" src="/images/main/2.svg" alt="">
                <p class="advantage__text">
                  Вся продукция сертифицирована
                </p>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="advantage">
                <img class="" src="/images/main/3.svg" alt="">
                <p class="advantage__text">
                  Контроль качества <br>на всех этапах
                </p>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="advantage">
                <img class="" src="/images/main/4.svg" alt="">
                <p class="advantage__text">
                  Поставки по всей России
                </p>
              </div>
            </div>
            <div class="swiper-slide">
              <div class="advantage">
                <img class="" src="/images/main/5.svg" alt="">
                <p class="advantage__text">
                  Оперативное производство
                </p>
              </div>
            </div>
          </div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
